<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ND Filter Calculator Widget</title>
<style>
  :root { --ink:#1a1a1a; --mut:#6b7280; --line:#e5e7eb; --acc:#2563eb; --bg:#ffffff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .widget { padding:16px 18px 10px; }
  .widget h1 { font-size:16px; font-weight:700; margin:0 0 2px; }
  .widget .sub { font-size:12px; color:var(--mut); margin:0 0 12px; }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:4px; }
  .field input, .field select { width:100%; padding:8px 10px; font-size:14px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .field .hint { font-size:11px; color:var(--mut); margin-top:3px; }
  .result { background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:12px; }
  .result .k { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .result .v { font-size:24px; font-weight:700; margin-top:2px; color:var(--acc); }
  .result .s { font-size:12px; color:var(--mut); }
  .note { font-size:11px; color:var(--mut); margin-top:10px; line-height:1.45; }
  .brand { text-align:center; font-size:11px; color:var(--mut); padding:8px 0 4px; border-top:1px solid var(--line); margin-top:12px; }
  .brand a { color:var(--acc); text-decoration:none; font-weight:600; }
  .brand a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="widget">
  <h1>ND Filter Calculator</h1>
  <p class="sub">Exact long-exposure shutter times for any neutral density filter.</p>

  <div class="field"><label for="base">Base shutter speed (seconds)</label>
    <input id="base" type="number" min="0.0001" step="any" value="0.5" inputmode="decimal">
    <div class="hint">e.g. 0.5 = 1/2 s &middot; 0.008 = 1/125 s &middot; 4 = 4 s</div>
  </div>

  <div class="field"><label for="filter">ND filter</label>
    <select id="filter"></select>
  </div>

  <div class="field"><label for="comp">Exposure compensation (stops, optional)</label>
    <input id="comp" type="number" min="-10" max="10" step="0.33" value="0" inputmode="decimal">
    <div class="hint">e.g. +0.33 for the half-stop between 10 and 13 stops.</div>
  </div>

  <div class="result">
    <div class="k">Shutter time with filter</div>
    <div class="v" id="r-time">&mdash;</div>
    <div class="s" id="r-stops"></div>
  </div>

  <div class="note">💡 <span id="reading"></span></div>
</div>

<div class="brand">Calculated with <a href="https://shuttermath.com/tools/nd-filter.html" target="_blank" rel="noopener">ShutterMath&rsquo;s ND filter calculator</a></div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var FILTERS = [
    ["ND2",1],["ND4",2],["ND8",3],["ND16",4],["ND32",5],["ND64",6],["ND100",6.7],
    ["ND128",7],["ND256",8],["ND400",8.7],["ND512",9],["ND1000",10],["ND2000",11],
    ["ND4000",12],["ND8000",13],["ND16000",14],["ND32000",15],["ND64000",16],["ND100000",16.7]
  ];
  FILTERS.forEach(function (f) {
    var o = document.createElement("option");
    o.value = f[1];
    o.textContent = f[0] + " (" + f[1] + " stops)";
    el("filter").appendChild(o);
  });
  el("filter").value = "10";
  function ndTime(base, stops) { return base * Math.pow(2, stops); }
  function fmtTime(s) {
    if (s >= 60) { var m = Math.floor(s/60); var r = Math.round((s - m*60)*10)/10; return r > 0 ? m+" min "+r+" s" : m+" min"; }
    if (s >= 1) return Math.round(s*10)/10 + " s";
    return Math.round(s*1000) + " ms";
  }
  function compute() {
    var base = parseFloat(el("base").value);
    var filterStops = parseFloat(el("filter").value);
    var comp = parseFloat(el("comp").value) || 0;
    var stops = filterStops + comp;
    if (!base || isNaN(stops)) return;
    var t = ndTime(base, stops);
    el("r-time").textContent = fmtTime(t);
    el("r-stops").textContent = (Math.round(stops*100)/100) + " stops";
    var fname = el("filter").selectedOptions[0] ? el("filter").selectedOptions[0].textContent.split(" ")[0] : "ND filter";
    el("reading").textContent = "With a " + fname + " on top of a " + fmtTime(base) + " base exposure, shoot at " + fmtTime(t) + ". Use bulb mode + a remote release (or the camera's 2-second timer) for a reliable long exposure.";
  }
  ["base","filter","comp"].forEach(function (id) { el(id).addEventListener("input", compute); });
  el("filter").addEventListener("change", compute);
  compute();
})();
</script>
</body>
</html>
